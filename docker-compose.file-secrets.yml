services:
  db:
    image: postgres:17
    container_name: node-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD_FILE: '/run/secrets/postgres_password'
      POSTGRES_DB: ${DB_NAME}

    secrets:
    - postgres_password

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

secrets:
  postgres_password:
    file: ${DB_PASSWORD_FILE}

volumes:
  postgres_data: