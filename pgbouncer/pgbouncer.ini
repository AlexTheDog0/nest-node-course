[databases]
marketplace = host=db port=5432 dbname=marketplace

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
admin_users = app
pool_mode = transaction
default_pool_size = 5
max_client_conn = 200
max_prepared_statements = 200
pidfile = /tmp/pgbouncer.pid
