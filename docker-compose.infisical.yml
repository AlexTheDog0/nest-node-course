name: marketplace-infisical

services:
  infisical:
    image: infisical/infisical:v0.165.16
    env_file: ./secrets/infisical/server.env
    environment:
      NODE_ENV: production
      SITE_URL: http://localhost:8088
      REDIS_URL: redis://redis:6379
      TELEMETRY_ENABLED: 'false'
    ports:
      - '127.0.0.1:8088:8080'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/api/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
  postgres:
    image: postgres:17
    env_file: ./secrets/infisical/server.env
    volumes:
      - infisical_postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U infisical -d infisical']
      interval: 2s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes:
      - infisical_redis:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  infisical_postgres:
  infisical_redis:
