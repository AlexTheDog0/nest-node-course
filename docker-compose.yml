name: marketplace-hw13

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: homework-development-only
      POSTGRES_DB: marketplace
    ports:
      - '127.0.0.1:5434:5432'
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U app -d marketplace']
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
