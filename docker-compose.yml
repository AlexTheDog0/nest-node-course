name: marketplace-hw13

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: homework-development-only
      POSTGRES_DB: marketplace
    ports:
      - '127.0.0.1:5434:5432'
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U app -d marketplace']
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '127.0.0.1:6432:5432'
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    healthcheck:
      test: [CMD-SHELL, 'PGPASSWORD=homework-development-only psql -h 127.0.0.1 -U app -d marketplace -tAc "SELECT 1" | grep -qx 1']
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres_data:
