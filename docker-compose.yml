name: marketplace-hw13

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: homework-development-only
      POSTGRES_DB: marketplace
    ports:
      - '127.0.0.1:5434:5432'
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U app -d marketplace']
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '127.0.0.1:6432:5432'
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    healthcheck:
      test: [CMD-SHELL, 'PGPASSWORD=homework-development-only psql -h 127.0.0.1 -U app -d marketplace -tAc "SELECT 1" | grep -qx 1']
      interval: 2s
      timeout: 5s
      retries: 30

  pact-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pact
      POSTGRES_PASSWORD: pact-development-only
      POSTGRES_DB: pact
    volumes:
      - pact_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U pact -d pact']
      interval: 2s
      timeout: 5s
      retries: 30

  pact-broker:
    image: pactfoundation/pact-broker:2.137.0-pactbroker2.118.0
    depends_on:
      pact-db:
        condition: service_healthy
    environment:
      PACT_BROKER_DATABASE_ADAPTER: postgres
      PACT_BROKER_DATABASE_HOST: pact-db
      PACT_BROKER_DATABASE_NAME: pact
      PACT_BROKER_DATABASE_USERNAME: pact
      PACT_BROKER_DATABASE_PASSWORD: pact-development-only
      PACT_BROKER_PORT: 9292
      PACT_BROKER_BASE_URL: ${PACT_BROKER_URL:-http://127.0.0.1:9292}
    ports:
      - '127.0.0.1:${PACT_BROKER_HOST_PORT:-9292}:9292'
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:9292/diagnostic/status/heartbeat']
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

volumes:
  pact_data:
  postgres_data:
